<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="642" viewBox="0 0 1200 642" role="img" aria-labelledby="title desc">
<title id="title">설문 저장과 관리자 조회는 다른 경로를 사용</title><desc id="desc">참여자는 Next.js API를 통해 서버용 키로 저장하고 관리자는 공개 키로 Supabase를 직접 조회한다. 임시 로그인은 DB 인증과 연결되어 있지 않다.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#7a8ca2"/></marker></defs>
<g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
<rect x="0" y="0" width="1200" height="642" rx="24" fill="#f4f7fb" stroke="#f4f7fb"/>
<text x="44" y="43" font-size="16" fill="#2563eb" font-weight="700">SURVEY / DATA FLOW</text>
<text x="44" y="90" font-size="34" fill="#102a43" font-weight="700">설문 저장과 관리자 조회는 다른 경로를 사용</text>
<text x="44" y="127" font-size="21" fill="#52657a" font-weight="400">현재 코드의 데이터 흐름 · survey_responses에 회차별로 저장합니다.</text>
<rect x="44" y="180" width="310" height="182" rx="16" fill="#fff" stroke="#dce5ef"/><rect x="64" y="200" width="50" height="30" rx="8" fill="#0f766e" stroke="#0f766e"/><text x="75" y="222" font-size="17" fill="#fff" font-weight="700">01</text><text x="66" y="268" font-size="26" fill="#102a43" font-weight="700">참여자 화면</text><text x="66" y="307" font-size="21" fill="#52657a" font-weight="400">정보 · 회차 · 두 문항 응답</text><text x="66" y="339" font-size="21" fill="#52657a" font-weight="400">POST /api/survey</text><rect x="427" y="180" width="345" height="182" rx="16" fill="#fff" stroke="#dce5ef"/><rect x="447" y="200" width="50" height="30" rx="8" fill="#2563eb" stroke="#2563eb"/><text x="458" y="222" font-size="17" fill="#fff" font-weight="700">02</text><text x="449" y="268" font-size="26" fill="#102a43" font-weight="700">Next.js API</text><text x="449" y="307" font-size="21" fill="#52657a" font-weight="400">서버용 키로 저장</text><text x="449" y="339" font-size="21" fill="#52657a" font-weight="400">필드명 변환 · 저장일시</text><rect x="845" y="180" width="311" height="182" rx="16" fill="#fff" stroke="#dce5ef"/><rect x="865" y="200" width="50" height="30" rx="8" fill="#7c3aed" stroke="#7c3aed"/><text x="876" y="222" font-size="17" fill="#fff" font-weight="700">03</text><text x="867" y="268" font-size="26" fill="#102a43" font-weight="700">Supabase</text><text x="867" y="307" font-size="21" fill="#52657a" font-weight="400">survey_responses</text><text x="867" y="339" font-size="21" fill="#52657a" font-weight="400">완료 1회 → 레코드 1개</text><path d="M354 270 L419 270" fill="none" stroke="#7a8ca2" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M772 270 L837 270" fill="none" stroke="#7a8ca2" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="44" y="411" width="728" height="114" rx="16" fill="#fff" stroke="#dce5ef"/><text x="68" y="451" font-size="25" fill="#102a43" font-weight="700">관리자 브라우저</text><text x="68" y="490" font-size="21" fill="#52657a" font-weight="400">공개 키로 직접 조회 → 참여자 집계 · 상세보기 · 요약 XLSX</text><path d="M1000 366 L1000 468 L780 468" fill="none" stroke="#7a8ca2" stroke-width="2.5" marker-end="url(#arrow)"/><text x="855" y="401" font-size="20" fill="#52657a" font-weight="400">조회 결과</text><rect x="44" y="552" width="1112" height="54" rx="16" fill="#fff3df" stroke="#f3d29f"/><text x="66" y="587" font-size="22" fill="#b45309" font-weight="700">현재 임시 관리자 로그인은 Supabase 인증과 연결되어 있지 않습니다.</text>
</g></svg>
