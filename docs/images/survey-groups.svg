<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="624" viewBox="0 0 1200 624" role="img" aria-labelledby="title desc">
<title id="title">그룹마다 두 문항, 총 30회 응답</title><desc id="desc">Group1은 문항1과2, Group2는3과4, Group3는5와6, Group4는7과8. 두 문항을 유지하고 무작위 조건을 재생성하며 30회 진행.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4 L0 8 Z" fill="#7a8ca2"/></marker></defs>
<g font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif">
<rect x="0" y="0" width="1200" height="624" rx="24" fill="#f4f7fb" stroke="#f4f7fb"/>
<text x="44" y="43" font-size="16" fill="#2563eb" font-weight="700">SURVEY / QUESTION GROUPS</text>
<text x="44" y="90" font-size="34" fill="#102a43" font-weight="700">그룹마다 두 문항, 총 30회 응답</text>
<text x="44" y="127" font-size="21" fill="#52657a" font-weight="400">기본 설문은 8개 중 2개를 선택하고, 그룹 설문은 아래 배정을 사용합니다.</text>
<rect x="44" y="175" width="536" height="165" rx="16" fill="#fff" stroke="#dce5ef"/><rect x="64" y="195" width="50" height="30" rx="8" fill="#0f766e" stroke="#0f766e"/><text x="75" y="217" font-size="17" fill="#fff" font-weight="700">G1</text><text x="66" y="263" font-size="26" fill="#102a43" font-weight="700">Group 1 · /survey/group1</text><text x="66" y="302" font-size="21" fill="#52657a" font-weight="400">1  피로도   |   2  장비 / 기술</text><rect x="620" y="175" width="536" height="165" rx="16" fill="#fff" stroke="#dce5ef"/><rect x="640" y="195" width="50" height="30" rx="8" fill="#2563eb" stroke="#2563eb"/><text x="651" y="217" font-size="17" fill="#fff" font-weight="700">G2</text><text x="642" y="263" font-size="26" fill="#102a43" font-weight="700">Group 2 · /survey/group2</text><text x="642" y="302" font-size="21" fill="#52657a" font-weight="400">3  절차 / 문서   |   4  교육 / 훈련</text><rect x="44" y="366" width="536" height="165" rx="16" fill="#fff" stroke="#dce5ef"/><rect x="64" y="386" width="50" height="30" rx="8" fill="#7c3aed" stroke="#7c3aed"/><text x="75" y="408" font-size="17" fill="#fff" font-weight="700">G3</text><text x="66" y="454" font-size="26" fill="#102a43" font-weight="700">Group 3 · /survey/group3</text><text x="66" y="493" font-size="21" fill="#52657a" font-weight="400">5  의사소통   |   6  환경요인</text><rect x="620" y="366" width="536" height="165" rx="16" fill="#fff" stroke="#dce5ef"/><rect x="640" y="386" width="50" height="30" rx="8" fill="#b45309" stroke="#b45309"/><text x="651" y="408" font-size="17" fill="#fff" font-weight="700">G4</text><text x="642" y="454" font-size="26" fill="#102a43" font-weight="700">Group 4 · /survey/group4</text><text x="642" y="493" font-size="21" fill="#52657a" font-weight="400">7  조직 / 관리   |   8  직무 복잡도</text><text x="44" y="580" font-size="24" fill="#102a43" font-weight="700">같은 두 문항 유지 → 조건 시나리오 재생성 → 응답 저장 → 다음 회차</text>
</g></svg>
